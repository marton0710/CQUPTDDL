name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    env:
      # 仅为让 pydantic-settings 通过校验；测试全部使用内存 SQLite，不会连真实库
      DATABASE_URL: sqlite+aiosqlite://
      SECRET_KEY: ci-only-secret-key
      QQBOT_URL: http://127.0.0.1:9999
      QQBOT_RECV_API_KEY: ci-only-recv-key
      QQBOT_SEND_API_KEY: ci-only-send-key
    steps:
      - name: 检出代码
        uses: builtin:checkout

      - name: 同步依赖（按 uv.lock，并下载 .python-version 指定的解释器）
        run: uv sync --dev --frozen

      - name: ruff check
        run: uvx ruff check .

      - name: ruff format --check
        run: uvx ruff format --check .

      - name: ty check
        run: uvx ty check

      - name: pytest
        run: uv run pytest -q
