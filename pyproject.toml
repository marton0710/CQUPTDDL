[project]
name = "cquptddl"
version = "2.1.5"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marton", email = "1146054766@qq.com" },
    { name = "Bail", email = "2915289604@qq.com" },
]
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "fuckids>=2.6",
    "furl>=2.1.4",
    "lxml>=6.1.0",
    "meetschedule-sdk>=1.4",
    "pycryptodome>=3.23.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "sqlmodel[asyncio]>=0.0.38",
    "uvicorn>=0.46.0",
    "abxbus>=2.5.45",
    "apscheduler>=3.11.3",
    "throttled-py>=3.4.1",
    "icalendar>=7.3.0",
    "httpx2>=2.16.0",
]

[[tool.uv.index]]
name = "Bail"
url = "https://git.bail.asia/api/packages/BailPlus/pypi/simple/"
publish-url = "https://git.bail.asia/api/packages/BailPlus/pypi"
explicit = true

[tool.uv.sources]
fuckids = { index = "Bail" }

[project.scripts]
cquptddl = "cquptddl:main"

[build-system]
requires = ["uv_build<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
]
