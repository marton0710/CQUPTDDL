<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CQUPTDDL API 测试台</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f0f4f8;
      --line: #d8dee8;
      --text: #172033;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --ok: #15803d;
      --warn: #b45309;
      --bad: #b91c1c;
      --shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: min(1280px, calc(100% - 28px));
      margin: 22px auto 36px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(280px, 1.4fr);
      gap: 14px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 24px;
    }

    h2 {
      font-size: 17px;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 15px;
      margin-bottom: 10px;
    }

    .subtle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #fff;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    button {
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 7px 12px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #fff;
      border-color: var(--line);
      color: var(--text);
    }

    button.secondary:hover {
      background: var(--panel-soft);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .token {
      min-height: 42px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      color: var(--muted);
      overflow-wrap: anywhere;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
    }

    .status-line {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 12px;
      color: var(--muted);
    }

    .badge.ok {
      color: var(--ok);
      border-color: rgba(21, 128, 61, 0.24);
      background: rgba(21, 128, 61, 0.08);
    }

    .badge.warn {
      color: var(--warn);
      border-color: rgba(180, 83, 9, 0.24);
      background: rgba(180, 83, 9, 0.08);
    }

    .badge.bad {
      color: var(--bad);
      border-color: rgba(185, 28, 28, 0.24);
      background: rgba(185, 28, 28, 0.08);
    }

    .result-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel-soft);
    }

    .summary-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .summary-card span {
      color: var(--muted);
      font-size: 13px;
    }

    pre {
      min-height: 280px;
      max-height: 620px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log {
      min-height: 74px;
      max-height: 170px;
      overflow: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
    }

    .log div {
      margin-bottom: 4px;
    }

    @media (max-width: 980px) {
      .topbar,
      .grid,
      .platform-grid,
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div class="panel">
        <h1>CQUPTDDL API 测试台</h1>
        <p class="subtle">原生 JS 页面，用来测试注册、登录、平台刷新、聚合获取和 Token 携带。</p>
        <div class="status-line">
          <span id="apiState" class="badge">未请求</span>
          <span id="lastRequest" class="badge">无最近请求</span>
        </div>
      </div>

      <div class="panel">
        <h2>连接配置</h2>
        <div class="form-grid">
          <label>
            后端地址
            <input id="baseUrl" value="http://127.0.0.1:8080" autocomplete="off" />
          </label>
          <label>
            当前 Token
            <input id="tokenInput" placeholder="登录后自动填入，也可以手动粘贴" autocomplete="off" />
          </label>
        </div>
        <div id="tokenView" class="token">未登录</div>
        <div class="actions">
          <button id="saveConfigBtn" type="button" class="secondary">保存配置</button>
          <button id="clearTokenBtn" type="button" class="secondary">清空 Token</button>
          <button id="testAllBtn" type="button">测试聚合接口</button>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="stack">
        <div class="panel">
          <h2>DDL 注册</h2>
          <label>
            用户名
            <input id="registerUsername" autocomplete="username" />
          </label>
          <label>
            邮箱
            <input id="registerEmail" type="email" autocomplete="email" />
          </label>
          <label>
            密码
            <input id="registerPassword" type="password" autocomplete="new-password" />
          </label>
          <label>
            确认密码
            <input id="registerConfirmPassword" type="password" autocomplete="new-password" />
          </label>
          <div class="actions">
            <button id="registerBtn" type="button">注册</button>
            <button id="copyRegisterToLoginBtn" type="button" class="secondary">填到登录</button>
          </div>
        </div>

        <div class="panel">
          <h2>DDL 登录</h2>
          <label>
            用户名
            <input id="loginUsername" autocomplete="username" />
          </label>
          <label>
            邮箱
            <input id="loginEmail" type="email" autocomplete="email" />
          </label>
          <label>
            密码
            <input id="loginPassword" type="password" autocomplete="current-password" />
          </label>
          <div class="actions">
            <button id="loginBtn" type="button">登录并保存 Token</button>
          </div>
        </div>
      </div>

      <div class="stack">
        <div class="platform-grid">
          <div class="panel">
            <h2>超星</h2>
            <label>
              平台账号
              <input id="chaoxingUsername" autocomplete="off" />
            </label>
            <label>
              平台密码
              <input id="chaoxingPassword" type="password" autocomplete="off" />
            </label>
            <div class="actions">
              <button id="chaoxingBtn" type="button">刷新超星</button>
            </div>
          </div>

          <div class="panel">
            <h2>学在重邮</h2>
            <label>
              平台账号
              <input id="xuezaiUsername" autocomplete="off" />
            </label>
            <label>
              平台密码
              <input id="xuezaiPassword" type="password" autocomplete="off" />
            </label>
            <div class="actions">
              <button id="xuezaiBtn" type="button">刷新学在</button>
            </div>
          </div>

          <div class="panel">
            <h2>雨课堂</h2>
            <label>
              平台账号
              <input id="yuketangUsername" autocomplete="off" />
            </label>
            <label>
              平台密码
              <input id="yuketangPassword" type="password" autocomplete="off" />
            </label>
            <div class="actions">
              <button id="yuketangBtn" type="button">刷新雨课堂</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>聚合结果</h2>
          <div class="summary">
            <div class="summary-card">
              <strong>超星</strong>
              <span id="chaoxingSummary">未请求</span>
            </div>
            <div class="summary-card">
              <strong>学在重邮</strong>
              <span id="xuezaiSummary">未请求</span>
            </div>
            <div class="summary-card">
              <strong>雨课堂</strong>
              <span id="yuketangSummary">未请求</span>
            </div>
          </div>
        </div>

        <div class="panel result-layout">
          <div>
            <h2>响应详情</h2>
            <pre id="result">等待请求...</pre>
          </div>
          <div>
            <h2>请求日志</h2>
            <div id="log" class="log"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const storage = {
      baseUrl: "cquptddl_test_base_url",
      token: "cquptddl_test_token"
    };

    const $ = (id) => document.getElementById(id);

    const el = {
      baseUrl: $("baseUrl"),
      tokenInput: $("tokenInput"),
      tokenView: $("tokenView"),
      apiState: $("apiState"),
      lastRequest: $("lastRequest"),
      result: $("result"),
      log: $("log"),
      registerUsername: $("registerUsername"),
      registerEmail: $("registerEmail"),
      registerPassword: $("registerPassword"),
      registerConfirmPassword: $("registerConfirmPassword"),
      loginUsername: $("loginUsername"),
      loginEmail: $("loginEmail"),
      loginPassword: $("loginPassword"),
      chaoxingUsername: $("chaoxingUsername"),
      chaoxingPassword: $("chaoxingPassword"),
      xuezaiUsername: $("xuezaiUsername"),
      xuezaiPassword: $("xuezaiPassword"),
      yuketangUsername: $("yuketangUsername"),
      yuketangPassword: $("yuketangPassword"),
      chaoxingSummary: $("chaoxingSummary"),
      xuezaiSummary: $("xuezaiSummary"),
      yuketangSummary: $("yuketangSummary")
    };

    function baseUrl() {
      return el.baseUrl.value.trim().replace(/\/+$/, "");
    }

    function token() {
      return el.tokenInput.value.trim();
    }

    function renderToken() {
      const value = token();
      el.tokenView.textContent = value || "未登录";
    }

    function saveConfig() {
      localStorage.setItem(storage.baseUrl, baseUrl());
      localStorage.setItem(storage.token, token());
      renderToken();
      setState("配置已保存", "ok");
    }

    function clearToken() {
      el.tokenInput.value = "";
      localStorage.removeItem(storage.token);
      renderToken();
      setState("Token 已清空", "warn");
    }

    function setState(text, type) {
      el.apiState.textContent = text;
      el.apiState.className = "badge" + (type ? " " + type : "");
    }

    function setLastRequest(text, type) {
      el.lastRequest.textContent = text;
      el.lastRequest.className = "badge" + (type ? " " + type : "");
    }

    function log(message) {
      const line = document.createElement("div");
      line.textContent = new Date().toLocaleTimeString() + "  " + message;
      el.log.prepend(line);
    }

    function showResult(payload) {
      el.result.textContent = JSON.stringify(payload, null, 2);
    }

    function setBusy(button, busy) {
      if (!button) return;
      button.disabled = busy;
      if (busy) {
        button.dataset.label = button.textContent;
        button.textContent = "请求中...";
      } else if (button.dataset.label) {
        button.textContent = button.dataset.label;
        delete button.dataset.label;
      }
    }

    async function request(path, options = {}) {
      const method = options.method || "GET";
      const url = baseUrl() + path;
      const headers = { "Content-Type": "application/json" };

      if (options.auth) {
        if (!token()) {
          throw new Error("缺少 Token，请先登录 DDL 或手动粘贴 Token");
        }
        headers.Authorization = "Bearer " + token();
      }

      setState("请求中", "warn");
      setLastRequest(method + " " + path);
      log(method + " " + path);

      const response = await fetch(url, {
        method,
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });

      const text = await response.text();
      let body = null;
      try {
        body = text ? JSON.parse(text) : null;
      } catch {
        body = text;
      }

      const payload = {
        request: {
          method,
          url,
          body: options.body || null,
          auth: Boolean(options.auth)
        },
        response: {
          status: response.status,
          ok: response.ok,
          body
        }
      };

      showResult(payload);

      if (!response.ok) {
        setState("请求失败", "bad");
        setLastRequest(response.status + " " + path, "bad");
        throw new Error(getErrorMessage(body, response.status));
      }

      setState("请求成功", "ok");
      setLastRequest(response.status + " " + path, "ok");
      return body;
    }

    function getErrorMessage(body, status) {
      if (body && typeof body === "object") {
        const detail = body.detail;
        if (detail && typeof detail === "object") {
          return detail.message || detail.code || JSON.stringify(detail);
        }
        return body.message || JSON.stringify(body);
      }
      return "HTTP " + status + ": " + String(body || "请求失败");
    }

    function platformBody(prefix) {
      return {
        username: el[prefix + "Username"].value.trim(),
        password: el[prefix + "Password"].value
      };
    }

    async function register() {
      return request("/api/ddl/register", {
        method: "POST",
        body: {
          username: el.registerUsername.value.trim(),
          password: el.registerPassword.value,
          confirm_password: el.registerConfirmPassword.value,
          email: el.registerEmail.value.trim()
        }
      });
    }

    async function loginDDL() {
      const data = await request("/api/ddl/login", {
        method: "POST",
        body: {
          username: el.loginUsername.value.trim(),
          password: el.loginPassword.value,
          email: el.loginEmail.value.trim()
        }
      });

      if (!data || !data.token) {
        throw new Error("登录成功但响应中没有 token 字段");
      }

      el.tokenInput.value = data.token;
      localStorage.setItem(storage.token, data.token);
      renderToken();
      setState("登录成功，Token 已保存", "ok");
      return data;
    }

    async function refreshPlatform(name) {
      return request("/api/" + name, {
        method: "POST",
        auth: true,
        body: platformBody(name)
      });
    }

    async function allHomework() {
      const data = await request("/api/ddl/all_homework", {
        method: "GET",
        auth: true
      });
      renderAllSummary(data);
      return data;
    }

    function renderAllSummary(data) {
      const platformData = data && data.data ? data.data : {};
      renderPlatformSummary("chaoxing", platformData.chaoxing);
      renderPlatformSummary("xuezai", platformData.xuezai);
      renderPlatformSummary("yuketang", platformData.yuketang);
    }

    function renderPlatformSummary(name, value) {
      const target = el[name + "Summary"];
      if (!value) {
        target.textContent = "无数据";
        return;
      }

      const count = Array.isArray(value.homework) ? value.homework.length : 0;
      if (value.errcode === 0) {
        target.textContent = "正常，作业 " + count + " 条";
      } else {
        target.textContent = "需要重新登录，已有作业 " + count + " 条";
      }
    }

    async function run(button, action) {
      setBusy(button, true);
      try {
        await action();
      } catch (error) {
        setState(error.message || "请求失败", "bad");
        log("失败：" + (error.message || "未知错误"));
      } finally {
        setBusy(button, false);
      }
    }

    function copyRegisterToLogin() {
      el.loginUsername.value = el.registerUsername.value;
      el.loginEmail.value = el.registerEmail.value;
      el.loginPassword.value = el.registerPassword.value;
      setState("已填入登录表单", "ok");
    }

    function init() {
      el.baseUrl.value = localStorage.getItem(storage.baseUrl) || el.baseUrl.value;
      el.tokenInput.value = localStorage.getItem(storage.token) || "";
      renderToken();

      $("saveConfigBtn").addEventListener("click", saveConfig);
      $("clearTokenBtn").addEventListener("click", clearToken);
      $("copyRegisterToLoginBtn").addEventListener("click", copyRegisterToLogin);
      $("registerBtn").addEventListener("click", (event) => run(event.currentTarget, register));
      $("loginBtn").addEventListener("click", (event) => run(event.currentTarget, loginDDL));
      $("chaoxingBtn").addEventListener("click", (event) => run(event.currentTarget, () => refreshPlatform("chaoxing")));
      $("xuezaiBtn").addEventListener("click", (event) => run(event.currentTarget, () => refreshPlatform("xuezai")));
      $("yuketangBtn").addEventListener("click", (event) => run(event.currentTarget, () => refreshPlatform("yuketang")));
      $("testAllBtn").addEventListener("click", (event) => run(event.currentTarget, allHomework));
      el.tokenInput.addEventListener("input", renderToken);
    }

    init();
  </script>
</body>
</html>
